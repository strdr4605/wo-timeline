# CI for pull requests and main. The jobs run in a chain: lint, unit, build, e2e, deploy.
# The e2e job tests the production build that deploy publishes, served the way GitHub Pages
# serves it: the app at /wo-timeline/, Storybook at /wo-timeline/storybook/.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A deploy to main is never cancelled mid-run; a newer pull request push cancels the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests (default reporter for the log, JSON report for the badge)
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=reports/unit.json
      # The badge steps also run after a failure, so the run keeps a red badge as an artifact.
      # Pages gets the badges only from a run where all jobs pass (see deploy).
      - name: Unit badge
        if: ${{ !cancelled() }}
        run: node tools/badge.mjs vitest reports/unit.json unit reports/badges/unit.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: badge-unit
          path: reports/badges/unit.json
          if-no-files-found: error

  build:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the app for /wo-timeline/
        run: npx ng build --base-href /wo-timeline/
      - name: Build Storybook into the site under storybook/
        run: npx ng run wo-timeline:build-storybook --output-dir dist/wo-timeline/browser/storybook
      - name: Serve the app for deep links and unknown paths
        run: cp dist/wo-timeline/browser/index.html dist/wo-timeline/browser/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/wo-timeline/browser
          if-no-files-found: error

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/pages
      - name: Serve the site as GitHub Pages does
        run: |
          node tools/serve-pages.mjs dist/pages --base=/wo-timeline/ --port=4300 &
          for i in $(seq 30); do curl -fs -o /dev/null http://localhost:4300/wo-timeline/ && exit 0; sleep 1; done
          exit 1
      - name: Playwright against the production build
        # A test tagged @local-only (none at present) would depend on the macOS font rendering.
        # SKIP_LOCAL_ONLY leaves such tests out on Linux.
        # The list reporter is for the log, the JSON report is for the badge.
        run: npx playwright test --reporter=list,json
        env:
          CI: 'true'
          BASE_URL: http://localhost:4300/wo-timeline/
          SKIP_LOCAL_ONLY: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/e2e.json
      - name: E2E badge
        if: ${{ !cancelled() }}
        run: node tools/badge.mjs playwright reports/e2e.json e2e reports/badges/e2e.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: badge-e2e
          path: reports/badges/e2e.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      # badges/unit.json and badges/e2e.json for the README (shields.io endpoint badges).
      - uses: actions/download-artifact@v4
        with:
          pattern: badge-*
          path: site/badges
          merge-multiple: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
