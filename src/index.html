<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Work Order Schedule Timeline</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
    Local copies of Circular Std. They are declared before the CDN stylesheet so the CDN
    file wins when it loads, and the local files keep the app readable when it does not.
    The files are licensed and not in the repo: public/fonts is optional and git-ignored.
  -->
    <style>
      @font-face {
        font-family: 'Circular-Std';
        src: url('fonts/CircularStd-Regular.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Circular-Std';
        src: url('fonts/CircularStd-Book.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Circular-Std';
        src: url('fonts/CircularStd-Medium.otf') format('opentype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Circular-Std';
        src: url('fonts/CircularStd-Bold.otf') format('opentype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://naologic-com-assets.naologic.com/fonts/circular-std/circular-std.css"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
