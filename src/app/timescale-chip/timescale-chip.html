<div class="timescale-chip">
  <span class="timescale-chip__label">{{ label() }}</span>
  <button
    type="button"
    class="timescale-chip__value"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    {{ value() }}
    <span class="timescale-chip__chevron" aria-hidden="true"></span>
  </button>
</div>

@if (open()) {
  <div class="timescale-menu" role="listbox">
    @for (option of options(); track option) {
      <button
        type="button"
        class="timescale-menu__item"
        role="option"
        [class.timescale-menu__item--selected]="option === value()"
        [attr.aria-selected]="option === value()"
        (click)="select(option)"
      >
        {{ option }}
      </button>
    }
  </div>
}
