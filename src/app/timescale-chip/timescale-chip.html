<div class="timescale-chip">
  <span class="timescale-chip__label">{{ label() }}</span>
  <button
    #trigger
    type="button"
    class="timescale-chip__value"
    aria-haspopup="listbox"
    aria-controls="timescale-menu"
    [attr.aria-label]="label() + ': ' + value()"
    [attr.aria-expanded]="open()"
    (click)="toggle($event)"
  >
    {{ value() }}
  </button>

  <!-- The line icon 'Nao_Icons/Line/Arrow/Simple/Down' of the design. -->
  <svg class="timescale-chip__chevron" viewBox="0 0 8.47 5" aria-hidden="true">
    <polyline points="0.6,0.6 4.235,4.2 7.87,0.6" />
  </svg>
</div>

@if (open()) {
  <div id="timescale-menu" class="timescale-menu" role="listbox" [attr.aria-label]="label()">
    @for (option of options(); track option) {
      <button
        type="button"
        class="timescale-menu__item"
        role="option"
        [class.timescale-menu__item--selected]="option === value()"
        [attr.aria-selected]="option === value()"
        [attr.tabindex]="option === value() ? 0 : -1"
        (click)="select(option)"
      >
        {{ option }}
      </button>
    }
  </div>
}
