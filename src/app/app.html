<header class="top-bar">
  <img class="logo" src="naologic-logo.svg" alt="Naologic" />
</header>

<main class="page">
  <div class="page__head">
    <h1 class="page__title">Work Orders</h1>

    <div class="toolbar">
      <app-timescale-chip [value]="timescale()" (valueChange)="timescale.set($event)" />

      <!-- The design has no Today button. Parity mode hides it, so the screenshots stay the same. -->
      @if (!parityMode) {
        <button
          type="button"
          class="today-button"
          aria-label="Today: scroll the timeline to today"
          (click)="grid.centerOnToday(true)"
        >
          Today
        </button>
      }

      <!-- Demo mode (?demo=1) only. Parity mode never shows it. See src/app/demo.ts. -->
      @if (demoMode) {
        <button type="button" class="today-button" (click)="loadDemoOrders()">Load 5,000 orders</button>
        <button type="button" class="today-button" (click)="loadDemoCenters()">Load 50 work centres</button>
        <button type="button" class="today-button" (click)="resetData()">Reset data</button>
      }
    </div>
  </div>

  <app-timeline-grid
    #grid
    [timescale]="timescale()"
    [workCenters]="workCenters()"
    [workOrders]="workOrders()"
    [selectedCenterId]="selectedCenterId()"
    [railWidth]="railWidth()"
    [drawerOrderId]="drawerOrderId()"
    (cellPick)="openCreate($event)"
    (editOrder)="openEdit($event)"
    (deleteOrder)="deleteOrder($event)"
    (resizeOrder)="resizeOrder($event)"
    (railWidthChange)="resizeRail($event)"
  />
</main>

<!-- Only a refused resize shows it, so the parity screenshots never contain it. -->
@if (resizeError(); as message) {
  <p class="resize-alert" role="alert">{{ message }}</p>
}

@if (demoMode) {
  <app-demo-badge [orderCount]="workOrders().length" />
}

<app-work-order-drawer [request]="drawer()" (closed)="drawer.set(null)" />
